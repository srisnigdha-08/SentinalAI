# Prometheus scrape config for `docker compose --profile monitoring up`.
# Both /metrics endpoints require `Authorization: Bearer <METRICS_TOKEN>` outside loopback: put the same
# value as METRICS_TOKEN in .env into deployment/metrics_token (one line, no newline needed; git-ignored).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: sentinel-backend
    metrics_path: /metrics
    authorization:
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["backend:5000"]

  - job_name: sentinel-ai-engine
    metrics_path: /metrics
    authorization:
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["ai-engine:8000"]
