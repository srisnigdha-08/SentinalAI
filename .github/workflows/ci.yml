name: SentinelAI CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  # Every job has a timeout (about 10x its usual 15-95 s) so a hung process fails fast instead of holding a runner
  # for GitHub's 6 h default.
  secret-scan:
    name: Secret scan (tree + pushed commits)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # commit scans need the history
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Prints commit, file, line, rule and the value's length only (scripts/security/secret_scan.cjs)
      - run: node --test scripts/security/secret_scan.test.cjs
      - name: Tracked files
        run: node scripts/security/secret_scan.cjs
      - name: Every commit in this push / pull request (catches a secret a later commit deleted)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            node scripts/security/secret_scan.cjs --range "$PR_BASE..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            node scripts/security/secret_scan.cjs --range "$BEFORE..$HEAD_SHA"
          else
            # new branch or rewritten history: every commit, minus the reviewed baseline
            node scripts/security/secret_scan.cjs --history
          fi

  backend:
    name: Backend (Lint & Test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install Socket.IO test client dependency
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Run ESLint
        working-directory: backend
        run: npm run lint

      - name: Run Jest test suite
        working-directory: backend
        run: npm test

  ai-engine:
    name: AI Engine (Pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-engine/requirements.txt

      - name: Install AI Engine dependencies
        working-directory: ai-engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest test suite
        working-directory: ai-engine
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend-mongo:
    name: Backend (MongoDB-backed suites)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports:
          - 27029:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The four suites skipped in the default job refuse any other host/port/database.
      AUTH_TEST_MONGO_URI: mongodb://127.0.0.1:27029/sentinelai_auth_timezone_test_20261014
      # aiEngineService refuses to load without a key; these are CI-only placeholders, never real secrets.
      SENTINEL_KEY: ci-mongo-suites-sentinel-key-0123456789  # secret-scan: allow (CI-only placeholder)
      HONEYPOT_API_KEY: ci-mongo-suites-honeypot-key-0123456789  # secret-scan: allow (CI-only placeholder)
      # The suites boot the real server, whose config validation requires distinct JWT secrets; locally these come
      # from backend/.env, which CI does not have. CLIENT_URL is the allowed Origin the suites send.
      JWT_SECRET: ci-mongo-suites-jwt-access-0123456789  # secret-scan: allow (CI-only placeholder)
      JWT_REFRESH_SECRET: ci-mongo-suites-jwt-refresh-0123456789  # secret-scan: allow (CI-only placeholder)
      CLIENT_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Run MongoDB-backed suites
        working-directory: backend
        run: npx jest --runInBand --ci tests/authPersistence.test.js tests/credentialLifecycleIntegration.test.js tests/timezonePersistence.test.js tests/authBrowser.test.js
      - name: SEC-001 tooling (synthetic accounts, disposable MongoDB)
        run: node --test --test-concurrency=1 scripts/security/sec001_check.test.cjs scripts/security/sec001_rotate.test.cjs

  model-integrity:
    name: Model registry integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-engine/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: ai-engine
      - name: Registered models match their pinned SHA-256
        working-directory: ai-engine
        run: python training/register_model.py --check
      - name: Engine loads the registered models and serves a prediction
        working-directory: ai-engine
        env:
          SENTINEL_KEY: ci-model-integrity-key-0123456789  # secret-scan: allow (CI-only placeholder)
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from inference.predictor import SentinelPredictor
          p = SentinelPredictor(model_dir='models')
          assert p._loaded and p.registry and p.registry['verified'], 'registered models failed to load'
          r = p.predict({'flow_duration': 1000.0, 'total_fwd_packets': 2.0})
          print(p.registry['classifier'], r['predictedClass'], r['threatScore'])
          "
      - name: Live engine over HTTP (every endpoint, CSV-name skew, honeypot, deception; no dataset needed)
        run: python scripts/ai_engine_endpoint_check.py --skip-dataset

  monitoring-config:
    name: Prometheus rules + Grafana dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prometheus config and alert rules are valid
        run: |
          echo ci-metrics-token > "$RUNNER_TEMP/metrics_token"
          docker run --rm --entrypoint promtool \
            -v "$PWD/deployment/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/deployment/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            -v "$RUNNER_TEMP/metrics_token:/etc/prometheus/metrics_token:ro" \
            prom/prometheus:v2.53.0 check config /etc/prometheus/prometheus.yml
      - name: Alert rule unit tests
        run: |
          docker run --rm --entrypoint promtool -w /rules \
            -v "$PWD/deployment/prometheus:/rules:ro" \
            prom/prometheus:v2.53.0 test rules alerts.test.yml
      - name: Grafana dashboard is valid JSON and uses the provisioned datasource
        run: |
          python3 -c "
          import json
          d = json.load(open('deployment/grafana/dashboards/sentinelai-overview.json'))
          uids = {p['datasource']['uid'] for p in d['panels'] if 'datasource' in p}
          assert uids == {'sentinel-prometheus'}, uids
          print(d['title'], len(d['panels']), 'panels')
          "
