name: SentinelAI Deployment

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  compose:
    name: Docker Compose verification
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verification safety checks
        run: node --test scripts/deploy/compose_verify.test.cjs
      - name: Prove cleanup after a failed run
        run: |
          status=0
          node scripts/deploy/compose_verify.cjs --inject-failure > "$RUNNER_TEMP/failure-path.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/failure-path.log"
          test "$status" -eq 1
          grep -q 'injected failure' "$RUNNER_TEMP/failure-path.log"
          label='label=com.docker.compose.project=sentinelai-verify'
          test -z "$(docker ps -aq --filter "$label")"
          test -z "$(docker network ls -q --filter "$label")"
          test -z "$(docker volume ls -q --filter "$label")"
      - name: Build and verify the real stack on disposable volumes
        run: node scripts/deploy/compose_verify.cjs
      - name: Scan the built images
        run: bash scripts/deploy/scan_images.sh
      # Also covers cancellation and timeout, where the verifier's own teardown cannot run. It runs outside the
      # checkout because Compose would otherwise load docker-compose.yml, which requires secrets this step does not have.
      - name: Remove any remaining disposable resources
        if: always()
        working-directory: ${{ runner.temp }}
        run: docker compose -p sentinelai-verify down -v --remove-orphans

  tls:
    name: Production TLS verification
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verification safety checks
        run: node --test scripts/deploy/tls_verify.test.cjs
      - name: Prove cleanup after a failed run
        run: |
          status=0
          node scripts/deploy/tls_verify.cjs --inject-failure > "$RUNNER_TEMP/failure-path.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/failure-path.log"
          test "$status" -eq 1
          grep -q 'injected failure' "$RUNNER_TEMP/failure-path.log"
          label='label=com.docker.compose.project=sentinelai-verify'
          test -z "$(docker ps -aq --filter "$label")"
          test -z "$(docker network ls -q --filter "$label")"
          test -z "$(docker volume ls -q --filter "$label")"
      - name: Build and verify HTTPS on disposable infrastructure
        run: node scripts/deploy/tls_verify.cjs
      - name: Scan the built images
        run: bash scripts/deploy/scan_images.sh
      - name: Remove any remaining disposable resources
        if: always()
        working-directory: ${{ runner.temp }}
        run: docker compose -p sentinelai-verify down -v --remove-orphans

  replicaset:
    name: Replica-set verification
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verification safety checks
        run: node --test scripts/deploy/replicaset_verify.test.cjs
      - name: Prove cleanup after a failed run
        run: |
          status=0
          node scripts/deploy/replicaset_verify.cjs --inject-failure > "$RUNNER_TEMP/failure-path.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/failure-path.log"
          test "$status" -eq 1
          grep -q 'injected failure' "$RUNNER_TEMP/failure-path.log"
          label='label=com.docker.compose.project=sentinelai-verify'
          test -z "$(docker ps -aq --filter "$label")"
          test -z "$(docker network ls -q --filter "$label")"
          test -z "$(docker volume ls -q --filter "$label")"
      - name: Build and verify the replica set on disposable infrastructure
        run: node scripts/deploy/replicaset_verify.cjs
      - name: Remove any remaining disposable resources
        if: always()
        working-directory: ${{ runner.temp }}
        run: docker compose -p sentinelai-verify down -v --remove-orphans

  recovery:
    name: Recovery and reliability verification
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verification safety checks
        run: node --test scripts/deploy/db_backup.test.cjs scripts/deploy/recovery_verify.test.cjs
      - name: Install age from its pinned release
        run: |
          bash scripts/deploy/install_age.sh "$RUNNER_TEMP/age"
          echo "AGE_BIN=$RUNNER_TEMP/age/age" >> "$GITHUB_ENV"
      - name: Prove cleanup after a failed run
        run: |
          status=0
          node scripts/deploy/recovery_verify.cjs --inject-failure > "$RUNNER_TEMP/failure-path.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/failure-path.log"
          test "$status" -eq 1
          grep -q 'injected failure' "$RUNNER_TEMP/failure-path.log"
          label='label=com.docker.compose.project=sentinelai-verify'
          test -z "$(docker ps -aq --filter "$label")"
          test -z "$(docker network ls -q --filter "$label")"
          test -z "$(docker volume ls -q --filter "$label")"
      - name: Failure injection, backup and recovery on disposable infrastructure
        run: node scripts/deploy/recovery_verify.cjs
      - name: Scan the built images
        run: bash scripts/deploy/scan_images.sh
      - name: Remove any remaining disposable resources
        if: always()
        working-directory: ${{ runner.temp }}
        run: docker compose -p sentinelai-verify --profile monitoring down -v --remove-orphans
