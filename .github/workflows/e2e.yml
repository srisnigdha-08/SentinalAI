name: SentinelAI E2E Tests

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - '**'

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    env:
      NODE_ENV: test
      CI: 'true'
      PORT: '5000'
      MONGO_URI: mongodb://127.0.0.1:27017/sentinelai_test
      CONTAINMENT_DRY_RUN: 'true'
      ALLOW_TEST_ROUTES: 'true'
      JWT_SECRET: test-e2e-jwt-super-secret-key-32-chars-min!
      JWT_REFRESH_SECRET: test-e2e-refresh-super-secret-key-32-chars!
      # Required by backend/config/validateEnv.js; backend/.env.test is git-ignored so CI must set them
      HONEYPOT_API_KEY: test-e2e-honeypot-ingest-key-32-chars-min
      SENTINEL_KEY: test-e2e-sentinel-internal-key-32-chars-min
      CSRF_SECRET: test-e2e-csrf-super-secret-key-32-chars!

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers with system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox

      - name: Run Playwright E2E Tests
        working-directory: frontend
        run: npx playwright test --project=chromium

      - name: Upload Playwright Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload Test Results on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: frontend/test-results/
          retention-days: 14
