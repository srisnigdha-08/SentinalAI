# Production TLS overlay. The development stack in docker-compose.yml is unchanged; this file adds to it:
#
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up --build     # needs Compose 2.24.4 or newer
#
# Needs in .env: TLS_PUBLIC_ORIGIN (the https:// address browsers use) and TLS_CERT_DIR (for example ./deployment/tls,
# which Git ignores), holding fullchain.pem and privkey.pem. nginx runs as uid 101 and must be able to read the key:
#
#   chown 101:101 privkey.pem && chmod 400 privkey.pem
#
# Only the HTTPS port is published, on this machine's loopback by default. To serve other hosts, set
# DASHBOARD_BIND_ADDRESS. A honeypot on another host then sends to https://<this host>/api/honeypot/ingest.
services:
  backend:
    environment:
      NODE_ENV: production
      CLIENT_URL: ${TLS_PUBLIC_ORIGIN:?set TLS_PUBLIC_ORIGIN in .env, for example https://sentinel.example:8443}
      # Exactly the proxy's address below. Forwarding headers from any other peer are ignored and the API answers 426.
      TRUST_PROXY: 172.30.250.2/32
      AUTH_REVOCATION_MODE: single
    ports: !reset []
    networks:
      - default
      - proxy

  frontend:
    user: "101:101"
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0700
      - /run:uid=101,gid=101,mode=0755
      - /tmp:uid=101,gid=101,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports: !override
      - "${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:8443:8443"
    volumes:
      - ./frontend/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:?set TLS_CERT_DIR in .env to the folder holding fullchain.pem and privkey.pem}:/etc/nginx/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
    # Not on the default network: the proxy can reach the backend, but not MongoDB or the AI engine.
    networks:
      ingress: {}
      proxy:
        ipv4_address: 172.30.250.2

networks:
  ingress: {}
  proxy:
    internal: true
    ipam:
      config:
        - subnet: 172.30.250.0/29
          # Docker assigns from the bottom of a subnet. Without this range another container would be handed the
          # proxy's address, which nginx then cannot claim and TRUST_PROXY would trust.
          ip_range: 172.30.250.4/30
