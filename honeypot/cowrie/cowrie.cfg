# Generated by honeypot/switch_profile.py (centos_7). Edit the template there, not this file.
[honeypot]
hostname             = centos-web-gateway
sensor_name          = sentinel-hp-01
log_path             = var/log/cowrie
interactive_timeout  = 180
auth_class           = UserDB
download_path        = ${honeypot:state_path}/downloads
download_limit_size  = 10485760
txtcmds_path         = personas/centos_7-txtcmds

[shell]
kernel_version       = 3.10.0-1160.el7.x86_64
kernel_build_string  = #1 SMP Mon Oct 19 16:18:59 UTC 2020
hardware_platform    = x86_64
operating_system     = GNU/Linux
filesystem           = personas/centos_7.pickle

[ssh]
version              = SSH-2.0-OpenSSH_7.4
listen_endpoints     = tcp:2222:interface=0.0.0.0
# No direct-tcpip forwarding: attackers must not use the honeypot as a proxy.
forwarding           = false

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json

# M5: off. It repeated every cowrie.json event in a second log that nothing reads.
[output_textlog]
enabled = false
logfile = ${honeypot:log_path}/cowrie.log

[output_pcap]
enabled = false
logfile = ${honeypot:log_path}/pcap/cowrie.pcap

[logging]
log_level = info

[output_sentinelblocker]
enabled = true
