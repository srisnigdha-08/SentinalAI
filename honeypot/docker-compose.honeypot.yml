# SentinelAI honeypot stack: Cowrie + the log parser, isolated from the host and the internet.
#
# UNTESTED: written without Docker available. Check the Cowrie image's paths (below) against the image
# you pin before relying on it.
#
# Runs on the honeypot host (Linux), separate from the SentinelAI stack:
#   cp ../deployment/.env.compose.example .env      # needs HONEYPOT_API_KEY; see variables below
#   docker compose -f docker-compose.honeypot.yml up -d
#   sudo BACKEND_IP=<backend address> ./docker/egress-rules.sh   # REQUIRED: cuts all other outbound traffic
#
# Containment:
#   - Cowrie runs as the image's non-root user, read-only root filesystem, no capabilities, no privilege
#     escalation, CPU/memory/process limits. Its only writable paths are var/ (logs, downloads) and /tmp.
#   - The containers sit on their own bridge (br-honeypot, 172.30.66.0/24). docker/egress-rules.sh lets that
#     bridge reach only the SentinelAI ingest port; Cowrie's wget/curl, SSH forwarding (also disabled in
#     cowrie.cfg) and any escape attempt get nowhere else. A Docker "internal" network cannot be used
#     because its ports cannot be published, and relaying the SSH port would hide the attacker's source IP.
#   - SSH is published on 127.0.0.1 by default (local testing). Set COWRIE_BIND=0.0.0.0 and COWRIE_PORT=22
#     to expose it, after moving the host's real sshd to another port.
#
# Variables: HONEYPOT_API_KEY (required), SENTINEL_API_URL (default http://172.30.66.1:5000/api, i.e. the
# backend on this host bound to the bridge gateway: start it with HOST=172.30.66.1), COWRIE_IMAGE,
# COWRIE_BIND, COWRIE_PORT.
name: sentinelai-honeypot

services:
  cowrie:
    # Pin a digest (cowrie/cowrie@sha256:...) once tested; "latest" changes under you.
    image: ${COWRIE_IMAGE:-cowrie/cowrie:latest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 256
    environment:
      HONEYPOT_API_KEY: ${HONEYPOT_API_KEY:?set HONEYPOT_API_KEY}
      SENTINEL_API_URL: ${SENTINEL_API_URL:-http://172.30.66.1:5000/api}
    # Paths as in the official image (WORKDIR /cowrie/cowrie-git).
    volumes:
      - ./cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./cowrie/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
      - ./cowrie/sentinelblocker.py:/cowrie/cowrie-git/src/cowrie/output/sentinelblocker.py:ro
      # Optional per-persona filesystems (build_honeyfs.py --fs-pickle; set COWRIE_PERSONA_FS=personas when
      # generating cowrie.cfg, which then sets [shell] filesystem = personas/<persona>.pickle):
      # - ./personas:/cowrie/cowrie-git/personas:ro
      - cowrie-var:/cowrie/cowrie-git/var
    ports:
      - "${COWRIE_BIND:-127.0.0.1}:${COWRIE_PORT:-2222}:2222"
    networks:
      honeypot:
        ipv4_address: 172.30.66.10

  parser:
    build: ./parsers
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.25
    environment:
      HONEYPOT_API_KEY: ${HONEYPOT_API_KEY:?set HONEYPOT_API_KEY}
      SENTINEL_API: ${SENTINEL_API_URL:-http://172.30.66.1:5000/api}
      PARSER_STATE_DIR: /state
    command: ["--live", "--log", "/cowrie-var/log/cowrie/cowrie.json"]
    volumes:
      - cowrie-var:/cowrie-var:ro # reads Cowrie's JSON log, cannot change it
      - parser-state:/state # offset, open sessions, delivery spool (holds captured credentials)
    depends_on:
      - cowrie
    networks:
      honeypot:
        ipv4_address: 172.30.66.11

networks:
  honeypot:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-honeypot
      com.docker.network.bridge.enable_icc: "false" # Cowrie cannot reach the parser container
    ipam:
      config:
        - subnet: 172.30.66.0/24
          gateway: 172.30.66.1

volumes:
  cowrie-var:
  parser-state:
