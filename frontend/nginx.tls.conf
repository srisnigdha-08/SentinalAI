# TLS endpoint for the production overlay (docker-compose.tls.yml). Runs as a non-root user with a read-only root
# filesystem, so it listens on an unprivileged port and has no plain-HTTP listener for clients.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

# Browsers remember HSTS per hostname and ignore the port, so sending it for localhost would break the plain-HTTP
# development dashboard on that machine for a year. An empty value makes nginx omit the header.
map $host $hsts_header {
  default   "max-age=31536000";
  localhost "";
  127.0.0.1 "";
}

server {
  listen 8443 ssl;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  ssl_certificate     /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:TLS:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Same string as frontend/csp.js (tests/csp.test.mjs checks they match)
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Strict-Transport-Security $hsts_header always;

  # Resolved per request, so a recreated backend container with a new address keeps working.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:5000;

  # Set here for every proxied location: a proxy_set_header inside a location would discard all of these.
  # Both forwarding headers overwrite whatever the client sent; the backend trusts them from this proxy only.
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Request-Id $request_id;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  # The backend sets its own copies; without this each would reach the browser twice.
  proxy_hide_header Strict-Transport-Security;
  proxy_hide_header Content-Security-Policy;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header Referrer-Policy;

  location /api/ {
    proxy_pass $backend;
  }

  location /socket.io/ {
    proxy_pass $backend;
  }

  # Single-page app: unknown paths serve index.html
  location / {
    try_files $uri /index.html;
  }
}

# Container healthcheck only: bound to the container's own loopback and never published.
server {
  listen 127.0.0.1:8081;
  access_log off;

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 404;
  }
}
