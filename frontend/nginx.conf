server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API and WebSocket go to the backend container; the Origin header is passed through unchanged so the
  # backend's CORS/CSRF origin checks see the dashboard origin (CLIENT_URL).
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /socket.io/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # Single-page app: unknown paths serve index.html
  location / {
    try_files $uri /index.html;
  }
}
